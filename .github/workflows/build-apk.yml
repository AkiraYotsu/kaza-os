name: Build TrKZ APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make Gradlew Executable
      run: chmod +x trkz-app/gradlew

    - name: Build Debug APK
      run: |
        cd trkz-app
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TrKZ-Terminal-v1.1-debug
        path: trkz-app/app/build/outputs/apk/debug/*.apk
